menu_driver = "rgui"
video_driver = "drm"
video_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_scale_integer = "true"
audio_driver = "alsa"
audio_latency = "64"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"
input_menu_toggle_btn = "nul"
input_exit_emulator_btn = "nul"
savefile_directory = "/data/Saves/sram"
savestate_directory = "/data/Saves/states"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"
config_save_on_exit = "false"
quit_press_twice = "false"
# The product shell owns the pause menu. If RetroArch closes content for any
# reason, leave the CLI session instead of trying to modeset a dummy core.
quit_on_close_content = "2"
savestate_auto_save = "true"
savestate_auto_load = "true"
autosave_interval = "10"
system_directory = "/data/BIOS"
